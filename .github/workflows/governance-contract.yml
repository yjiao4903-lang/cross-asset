name: Governance Contract

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Validate logical role and PR contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as fh:
              event = json.load(fh)

          pr = event["pull_request"]
          head_ref = pr["head"]["ref"]
          body = pr.get("body") or ""

          prefixes = {
              "gpt/": "GPT-DEV",
              "grok/": "GROK-DEV",
              "local/": "LOCAL-DEV",
              "control/": "WEB-CONTROL",
              "governance/": "WEB-CONTROL",
          }

          expected_role = next(
              (role for prefix, role in prefixes.items() if head_ref.startswith(prefix)),
              None,
          )

          if expected_role is None:
              print(f"LEGACY_UNGOVERNED_BRANCH: {head_ref}")
              print("Governance contract is not enforced for pre-v2 branch naming.")
              sys.exit(0)

          def field_value(label: str):
              match = re.search(rf"^- {re.escape(label)}:\s*(.*)$", body, re.MULTILINE)
              if not match:
                  return None
              value = re.sub(r"<!--.*?-->", "", match.group(1)).strip()
              value = value.replace("**", "").strip()
              return value

          failures = []
          role = field_value("Role")
          if role != expected_role:
              failures.append(
                  f"Role must be {expected_role!r} for branch {head_ref!r}; got {role!r}."
              )

          required_fields = [
              "Workstream",
              "Task/Issue",
              "Routing mode",
              "Task baseline",
              "Current main at start",
              "Active-PR overlap check",
              "Tests",
              "CI",
              "Exact-head evidence",
              "Production impact",
          ]
          for label in required_fields:
              value = field_value(label)
              if not value:
                  failures.append(f"Missing or empty PR field: {label}")

          if "CI PASS != MERGE_APPROVED" not in body:
              failures.append("Authority acknowledgement is missing.")

          if failures:
              print("GOVERNANCE_CONTRACT_FAIL")
              for failure in failures:
                  print(f"- {failure}")
              sys.exit(1)

          print("GOVERNANCE_CONTRACT_PASS")
          print(f"logical_role={expected_role}")
          print(f"branch={head_ref}")
          print(f"head={pr['head']['sha']}")
          PY
