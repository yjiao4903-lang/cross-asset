name: Launcher CI

on:
  pull_request:
    paths:
      - 'launcher/**'
      - 'START_MACRO_WORKBENCH.cmd'
      - 'STOP_MACRO_WORKBENCH.cmd'
      - '.github/workflows/launcher.yml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/vite.config.*'
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - 'START_MACRO_WORKBENCH.cmd'
      - 'STOP_MACRO_WORKBENCH.cmd'
      - '.github/workflows/launcher.yml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/vite.config.*'

permissions:
  contents: read

jobs:
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Launcher T1-T9 integration matrix
        shell: powershell
        env:
          MACRO_WORKBENCH_NO_BROWSER: '1'
        run: .\launcher\tests\launcher.tests.ps1
      - name: Frontend regression on Windows
        shell: powershell
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
