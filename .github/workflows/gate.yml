name: Gate CI (G4 candidate)

# Gate-Driven CI v1：
# 仅对进入正式 G4 的 exact head 运行 Ubuntu + Windows 双平台全量验证。
# 由 WEB-CONTROL / 开发窗口在 exact head 固定后手动触发，
# 每个 candidate 只跑一次，不随普通 push 重复执行。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact head to validate (branch, tag or full commit SHA); empty = default branch"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # 允许 checkout 任意历史 commit SHA（G4 exact head）。
          fetch-depth: 0
      - name: Record exact head
        run: |
          echo "exact head: $(git rev-parse HEAD)" | tee "$GITHUB_STEP_SUMMARY"
        shell: bash
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Ruff
        run: python -m ruff check src tests
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider
