version: "0.2"
status: DEVELOPMENT_PRIOR
require_source_admission: true
purpose: Personal weekly review cutoff and fact-table contract. Not a trading schedule.
clock:
  timezone: Asia/Shanghai
  label: 北京时间
  naive_timestamps: interpret_as_asia_shanghai
week_end_weekday: Friday
review_weekday: Saturday
review_local_time: "12:00"
lookbacks:
  week: {days: 7, label: 1w}
  month: {days: 21, label: 21d_calendar}
required_series:
  - {series_id: CN_EQ_LARGE, asset_id: CN_EQ, kind: price, unit: index_points, max_age_days: 7, usage: PERSONAL_WEEKLY, provider: manual}
  - {series_id: HK_EQ, asset_id: HK_EQ, kind: price, unit: index_points, max_age_days: 7, usage: PERSONAL_WEEKLY, provider: manual}
  - {series_id: US_EQ, asset_id: US_EQ, kind: price, unit: index_points, max_age_days: 7, usage: PERSONAL_WEEKLY, provider: fred}
  - {series_id: CN_BOND_10Y, asset_id: CN_BOND, kind: yield, unit: percent, max_age_days: 7, usage: PERSONAL_WEEKLY, provider: manual}
  - {series_id: GOLD, asset_id: GOLD, kind: price, unit: price, max_age_days: 7, usage: PERSONAL_WEEKLY, provider: manual}
  - {series_id: COPPER, asset_id: COMMODITY, kind: price, unit: price, max_age_days: 7, usage: PERSONAL_WEEKLY, provider: manual}
overlay_series:
  - {series_id: CN_BOND_2Y, kind: yield, unit: percent}
  - {series_id: US_GOV_10Y, kind: yield, unit: percent}
  - {series_id: US_GOV_2Y, kind: yield, unit: percent}
  - {series_id: CN_DR007, kind: yield, unit: percent}
  - {series_id: CN_PMI, kind: level, unit: index}
  - {series_id: CN_CPI, kind: level, unit: percent}
  - {series_id: CN_PPI, kind: level, unit: percent}
  - {series_id: CN_M1, kind: level, unit: percent}
session_close_beijing:
  CN_EQ_LARGE: "15:00"
  HK_EQ: "16:00"
  CN_BOND_10Y: "15:30"
  US_EQ: "次日 04:00–05:00（视夏令时）；FRED 保守记次日 12:00 前"
  GOLD: "次日 05:00–06:00；保守记次日 12:00 前"
  COPPER: "次日 05:00–06:00；保守记次日 12:00 前"
notes:
  - 所有比较时钟为北京时间 Asia/Shanghai。无时区时间戳按北京时间解释。
  - 观察日仍按各市场交易日（周五周终），复盘截止默认为次日周六 12:00 北京时间。
  - 周五北京晚间看不到当周美股/COMEX 收盘；周六 12:00 可以看到。
  - Missing required latest level fails closed as DATA_BLOCKED.
  - The month label is explicitly 21d_calendar; actual prior date is retained, never presented as a natural month or trading-month return.
  - Missing lookback windows are PARTIAL, never zero-filled.
  - Yield series report level change in basis points, not percent return.
  - This contract does not change strategic weights or authorize trades.
  - Overlay series are declared only; this acceptance does not score them, treat missing overlay as DATA_BLOCKED, or fill zeros.
  - Default decision is 不行动 / HOLD. No win-rate, odds, or causal story ranking in this loop.
  - PERSONAL_WEEKLY / DEVELOPMENT_PRIOR only; not RESEARCH_ADMISSIBLE.
