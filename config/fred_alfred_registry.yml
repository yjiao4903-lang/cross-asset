availability_contract:
  policy: "VINTAGE_DATE_PLUS_2D_UTC_CONSERVATIVE"
  note: >-
    FRED/ALFRED vintage dates are date-granular release/change dates, not exact
    publication timestamps. C0 historical research therefore treats a vintage
    as available no earlier than 00:00 UTC two calendar days after the vintage date;
    exact release-time evidence can later supersede this C0 guard.
