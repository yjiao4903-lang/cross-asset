version: "0.2"
status: DEVELOPMENT_PRIOR
usage: PERSONAL_WEEKLY
timezone: Asia/Shanghai
description: Mixed-provider admission for personal weekly replay. This DEVELOPMENT_PRIOR contract does not grant RESEARCH_ADMISSIBLE.
series:
  CN_EQ_LARGE:
    provider: manual
    source_series_id: CN_EQ_LARGE
    kind: price
    available_at_rule: CN_SESSION_CLOSE_BEIJING
    usage: PERSONAL_WEEKLY
  HK_EQ:
    provider: manual
    source_series_id: HK_EQ
    kind: price
    available_at_rule: HK_SESSION_CLOSE_BEIJING
    usage: PERSONAL_WEEKLY
  US_EQ:
    provider: fred
    source_series_id: SP500
    instrument_semantics: SP500_PRICE_INDEX
    kind: price
    available_at_rule: FRED_SP500_BEIJING_CONSERVATIVE
    available_at_basis: POLICY_DERIVED
    usage: PERSONAL_WEEKLY
