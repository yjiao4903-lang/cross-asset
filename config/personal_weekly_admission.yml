    provider: manual
    source_series_id: CN_BOND_10Y
    kind: yield
    available_at_rule: CN_SESSION_CLOSE_BEIJING
    usage: PERSONAL_WEEKLY
  GOLD:
    provider: manual
    source_series_id: GOLD
    kind: price
    available_at_rule: COMEX_CLOSE_BEIJING_CONSERVATIVE
    usage: PERSONAL_WEEKLY
  COPPER:
    provider: manual
    source_series_id: COPPER
    kind: price
    available_at_rule: COMEX_CLOSE_BEIJING_CONSERVATIVE
    usage: PERSONAL_WEEKLY
rules:
  require_available_at_le_decision_time: true
  decision_time: "Saturday 12:00 Asia/Shanghai"
  zero_imputation: false
  mixed_providers_allowed: true
  silent_provider_fallback: false
  formal_research_admission: not_claimed
