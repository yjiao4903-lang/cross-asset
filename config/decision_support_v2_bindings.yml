version: 2
contract: REAL_SNAPSHOT_V1
note: >-
  Binding overlay for the accepted decision_support_v2 factor taxonomy. Only exact,
  repository-governed canonical identities may be MONITORING=BOUND. Factors whose
  exact raw identity or transform contract is unavailable remain absent/UNBOUND.

bindings:
